  <div id="dateArea"></div>
  <div id="guideText">To turn the screen back on, please press any button except for the power button.</div>
  <div id="mask"></div>
</div>

<script>
const clockShape = document.getElementById('clockShape');
const dateArea = document.getElementById('dateArea');
const guideText = document.getElementById('guideText');
const mask = document.getElementById('mask');
const hourArm = document.getElementById('hourArm');
const minArm = document.getElementById('minArm');
const stage = document.getElementById('stage');

let displayUpperArea = false;

function updateTime(){
  const now = new Date();
  const h = now.getUTCHours() % 12;
  const m = now.getUTCMinutes() % 60;
  const s = now.getUTCSeconds() % 60;
  const hourAngle = (h + m/60) * 30;
  const minuteAngle = (m + s/60) * 6;
  hourArm.style.transform = `rotate(${hourAngle}deg)`;
  minArm.style.transform = `rotate(${minuteAngle}deg)`;
  dateArea.textContent = now.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
setInterval(updateTime, 1000);
updateTime();

function setOpacity(el, val, duration){
  el.style.transition = `opacity ${duration}ms linear`;
  requestAnimationFrame(()=>{ el.style.opacity = val; });
}

// instantly snaps opacity with no transition, and clears any leftover
// inline transition so it doesn't bleed into the next animated change
function resetOpacity(el, val){
  el.style.transition = 'none';
  el.style.opacity = val;
  void el.offsetWidth; // force reflow so the 'none' transition actually applies
  el.style.transition = '';
}

// sequence timings straight from Clock.qml's SequentialAnimation
const mainFadeInOutTime = 3000;
const displayDurationTime = 5000;
const infoFadeInOutTime = 500;
const guideTextFadeInTime = 3000;

function runCycle(){
  stage.style.setProperty('--clockTop', displayUpperArea ? '62%' : '38%');
  resetOpacity(guideText, 0);
  resetOpacity(dateArea, 1);
  resetOpacity(clockShape, 1);

  let t = 0;
  // 1. mask fades 1 -> 0 (reveal)
  setOpacity(mask, 0, mainFadeInOutTime);
  t += mainFadeInOutTime;

  // 2. pause
  t += displayDurationTime;

  // 3. date fades out, weather fades in (weather is empty in source, so just date disappears)
  setTimeout(()=> setOpacity(dateArea, 0, infoFadeInOutTime), t);
  t += infoFadeInOutTime;

  // 4. pause
  t += displayDurationTime;

  // 5. clock (+weather) fades out
  setTimeout(()=> setOpacity(clockShape, 0, infoFadeInOutTime), t);
  t += infoFadeInOutTime;

  // 6. guide text fades in
  setTimeout(()=> setOpacity(guideText, 1, guideTextFadeInTime), t);
  t += guideTextFadeInTime;

  // 7. pause
  t += displayDurationTime;

  // 8. mask fades 0 -> 1 (hide, loop)
  setTimeout(()=> setOpacity(mask, 1, mainFadeInOutTime), t);
  t += mainFadeInOutTime;

  setTimeout(()=>{
    displayUpperArea = !displayUpperArea;
    runCycle();
  }, t + 50);
}

runCycle();
</script>
