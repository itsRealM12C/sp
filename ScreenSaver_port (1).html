const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const particleImg = new Image();
particleImg.src = PARTICLE_SRC;

function sampleGradient(stops, t){
  t = Math.max(0, Math.min(1, t));
  for(let i=0;i<stops.length-1;i++){
    const [t0,r0,g0,b0] = stops[i];
    const [t1,r1,g1,b1] = stops[i+1];
    if(t >= t0 && t <= t1){
      const f = (t1===t0) ? 0 : (t-t0)/(t1-t0);
      return [r0+(r1-r0)*f, g0+(g1-g0)*f, b0+(b1-b0)*f];
    }
  }
  const last = stops[stops.length-1];
  return [last[1], last[2], last[3]];
}

// box: reference size scaled down from the original 600x600 (UI_SCALE shrinks the whole emitter/text)
const UI_SCALE = 0.32;
function refBox(){
  const scaleX = canvas.width / 1920;
  const scaleY = canvas.height / 1080;
  const w = Math.round(600 * UI_SCALE * scaleX);
  const h = Math.round(600 * UI_SCALE * scaleY);
  return { w, h };
}

let cx = 0, cy = 0; // emitter center
let particles = [];
const GROUPS = ['red','cyan','blue'];

function rand(min, max){ return min + Math.random()*(max-min); }

function spawnBurst(){
  const box = refBox();
  // resolution scale: how big this canvas is relative to the 1920x1080 reference,
  // so particle size/speed look the same proportionally whether this is a full
  // 1920x1080 TV screen or a small browser preview window
  const resScale = Math.min(canvas.width / 1920, canvas.height / 1080);

  cx = Math.random() * (canvas.width - box.w) + box.w/2;
  cy = Math.random() * (canvas.height - box.h) + box.h/2;

  document.getElementById('label').style.width = box.w + 'px';
  document.getElementById('label').style.left = (cx - box.w/2) + 'px';
  document.getElementById('label').style.top = (cy + box.h/2 - 50*resScale) + 'px';

  const lifeMs = 5000;
  const lifeVar = 1000;
  const emitRate = 500; // particles/sec
  const pulseDuration = 1000; // ms
  const totalPerGroup = Math.round(emitRate * pulseDuration/1000);

  GROUPS.forEach(group => {
    for(let i=0;i<totalPerGroup;i++){
      const angle = rand(0, 360) * Math.PI/180;
      const accelAngle = rand(0,360) * Math.PI/180;
      const speed = rand(7,10) * resScale;
      const accel = rand(12,17) * resScale;
      particles.push({
        group,
        x: cx, y: cy,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        ax: Math.cos(accelAngle)*accel,
        ay: Math.sin(accelAngle)*accel,
        born: performance.now() + rand(0, pulseDuration),
        life: lifeMs + rand(-lifeVar, lifeVar),
        size: rand(10, 22) * UI_SCALE * resScale
      });
    }
  });

  // fade label in, then out, matching fadeIn(3500)/fadeOut(3500)
  const label = document.getElementById('label');
  label.style.transition = 'opacity 3.5s ease-out';
  label.style.opacity = 1;
  setTimeout(()=>{ label.style.opacity = 0; }, 3500);
}

let lastT = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;

  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.globalCompositeOperation = 'lighter';

  particles = particles.filter(p => {
    const age = now - p.born;
    if(age < 0) return true; // not yet emitted
    if(age > p.life) return false;

    // turbulence: light random jitter to velocity, approximating QtQuick Turbulence
    const jScale = Math.min(canvas.width/1920, canvas.height/1080);
    p.vx += rand(-8,8) * jScale * dt;
    p.vy += rand(-8,8) * jScale * dt;

    p.vx += p.ax * dt;
    p.vy += p.ay * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    const lifeFrac = age / p.life;
    // entry fade (first 10%) + exit fade (last 25%), mimicking ImageParticle.Fade entryEffect
    let alpha = 1;
    if(lifeFrac < 0.1) alpha = lifeFrac/0.1;
    else if(lifeFrac > 0.75) alpha = 1 - (lifeFrac-0.75)/0.25;

    const [r,g,b] = sampleGradient(GRADIENTS[p.group], lifeFrac);
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.9;
    ctx.drawImage(particleImg, p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    // tint pass using source-atop
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${(alpha*0.55).toFixed(3)})`;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.restore();

    return true;
  });

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(tick);
}

// loop: matches animation_timer interval 7500ms -> looped() -> reload -> new burst
spawnBurst();
setInterval(spawnBurst, 7500);
requestAnimationFrame(tick);
